<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♞ Chess — Neon Arcade</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .chess-board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: min(520px, 92vw);
    aspect-ratio: 1;
    border: 2px solid var(--tile-border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(0,240,255,.15);
    margin: 0 auto;
    user-select: none;
    -webkit-user-select: none;
  }
  .sq {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(26px, 6.5vw, 46px);
    line-height: 1;
    padding: 0;
    border: 0;
    cursor: pointer;
  }
  .sq.light { background: #2b2b55; }
  .sq.dark { background: #161631; }
  .sq .pc-w { color: #f4f6ff; text-shadow: 0 0 3px #000, 0 0 14px rgba(0,240,255,.9); }
  .sq .pc-b { color: #0a0a16; text-shadow: 0 0 3px rgba(255,255,255,.85), 0 0 14px rgba(255,47,214,.75); }
  .sq.sel { outline: 3px solid var(--cyan); outline-offset: -3px; z-index: 2; }
  .sq.last { box-shadow: inset 0 0 0 3px rgba(255,225,77,.7); }
  .sq.check { box-shadow: inset 0 0 22px 5px rgba(255,77,109,.95); animation: checkpulse 1.1s ease-in-out infinite; }
  @keyframes checkpulse {
    0%, 100% { box-shadow: inset 0 0 22px 5px rgba(255,77,109,.95); }
    50% { box-shadow: inset 0 0 10px 2px rgba(255,77,109,.5); }
  }
  .sq .dot {
    position: absolute;
    width: 26%; height: 26%;
    border-radius: 50%;
    background: rgba(0,240,255,.55);
    box-shadow: 0 0 10px rgba(0,240,255,.8);
    pointer-events: none;
  }
  .sq .cap-ring {
    position: absolute;
    inset: 5%;
    border-radius: 50%;
    border: 3px solid rgba(255,77,109,.85);
    box-shadow: 0 0 12px rgba(255,77,109,.5);
    pointer-events: none;
  }
  .sq .coord {
    position: absolute;
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    pointer-events: none;
    line-height: 1;
  }
  .sq .coord.rank { top: 3px; left: 4px; }
  .sq .coord.file { bottom: 3px; right: 5px; }
  .sq.light .coord { color: #8f96c9; }
  .sq.dark .coord { color: #5c639c; }

  .moves {
    max-height: 200px;
    overflow-y: auto;
    font-size: 14px;
    border: 1px solid rgba(154,163,199,.25);
    border-radius: 10px;
    padding: 6px 4px;
    margin: 10px 0;
    background: rgba(6,6,20,.5);
    min-height: 44px;
  }
  .mrow {
    display: grid;
    grid-template-columns: 40px 1fr 1fr;
    padding: 3px 8px;
    border-radius: 6px;
    font-variant-numeric: tabular-nums;
  }
  .mrow:nth-child(odd) { background: rgba(0,240,255,.06); }
  .mnum { color: var(--muted); }

  .captured { font-size: 14px; margin: 8px 0; min-height: 44px; }
  .cap-row { display: flex; gap: 8px; align-items: baseline; margin: 4px 0; }
  .cap-label { color: var(--muted); white-space: nowrap; }
  .cap-pieces { font-size: 19px; letter-spacing: 1px; }
  .matdiff { color: var(--green); font-weight: 700; font-size: 13px; }

  .promo-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
  }
  .promo-overlay[hidden] { display: none; }
  .promo-box {
    background: #10102a;
    border: 1px solid var(--cyan);
    border-radius: 16px;
    padding: 22px 26px;
    text-align: center;
    box-shadow: 0 0 30px rgba(0,240,255,.4);
  }
  .promo-title { margin-bottom: 14px; font-weight: 700; font-size: 17px; }
  .promo-btns { display: flex; gap: 10px; }
  .promo-btn {
    font-size: 52px;
    line-height: 1;
    width: 76px; height: 76px;
    border-radius: 14px;
    border: 1px solid var(--tile-border);
    background: rgba(10,10,30,.9);
    cursor: pointer;
    transition: all .14s ease;
  }
  .promo-btn:hover { border-color: var(--cyan); box-shadow: 0 0 16px rgba(0,240,255,.5); transform: translateY(-2px); }
  .promo-btn.pc-w { color: #f4f6ff; text-shadow: 0 0 3px #000, 0 0 14px rgba(0,240,255,.9); }
  .promo-btn.pc-b { color: #0a0a16; text-shadow: 0 0 3px rgba(255,255,255,.85), 0 0 14px rgba(255,47,214,.75); }

  .side-btn.active { background: rgba(0,240,255,.22); box-shadow: 0 0 16px rgba(0,240,255,.45); color: var(--cyan); border-color: var(--cyan); }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="back-link" href="../index.html">← Arcade</a>
    <div class="logo">🕹️ NEON ARCADE</div>
  </header>

  <h1 class="game-title">♞ Chess</h1>
  <div id="difficulty-bar"></div>

  <div class="game-layout">
    <div class="panel">
      <div class="chess-board" id="board" role="grid" aria-label="Chess board"></div>
    </div>
    <div class="panel" style="min-width:280px; flex:1;">
      <div class="status" id="status"></div>
      <div class="moves" id="moves" aria-label="Move list"></div>
      <div class="captured" id="captured"></div>
      <div class="btn-row">
        <span style="color:var(--muted); font-size:14px;">Play as:</span>
        <button class="btn side-btn active" id="side-w" type="button">♔ White</button>
        <button class="btn side-btn" id="side-b" type="button">♚ Black</button>
      </div>
      <div class="btn-row">
        <button class="btn" id="new-game" type="button">New game</button>
        <button class="btn" id="flip-board" type="button">Flip board</button>
        <button class="btn danger" id="resign" type="button">Resign</button>
      </div>
      <p style="color:var(--muted); font-size:13px; line-height:1.6;">
        Full tournament rules: castling, en passant, promotion, fifty-move rule,
        threefold repetition, and stalemate. Beat the computer to climb a difficulty
        level; lose twice in a row and it eases off.
      </p>
    </div>
  </div>
</div>

<div class="promo-overlay" id="promo-modal" hidden>
  <div class="promo-box">
    <div class="promo-title">Promote pawn to:</div>
    <div class="promo-btns" id="promo-btns"></div>
  </div>
</div>

<script src="../js/difficulty.js"></script>
<script src="chess-logic.js"></script>
<script src="chess-ui.js"></script>
</body>
</html>
