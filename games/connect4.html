<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect 4 — Neon Arcade</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .c4-board {
    display: grid;
    grid-template-columns: repeat(7, 62px);
    grid-template-rows: repeat(6, 62px);
    gap: 8px;
    justify-content: center;
    background: #0a1a3f;
    padding: 16px;
    border-radius: 18px;
    border: 1px solid rgba(0, 240, 255, 0.35);
    box-shadow: 0 0 30px rgba(0, 80, 255, 0.25), inset 0 0 40px rgba(0,0,0,.5);
  }
  .c4-board .cell {
    border-radius: 50%;
    border: none;
    background: #06060f;
    box-shadow: inset 0 3px 8px rgba(0,0,0,.8);
    cursor: pointer;
    transition: transform 0.1s ease;
    padding: 0;
  }
  .c4-board .cell:hover:not(:disabled) { transform: scale(1.06); }
  .c4-board .cell:disabled { cursor: default; }
  .c4-board .cell.red { background: radial-gradient(circle at 35% 30%, #ff8fa3, #ff4d6d 60%, #c9184a); box-shadow: 0 0 16px rgba(255,77,109,.7); }
  .c4-board .cell.yellow { background: radial-gradient(circle at 35% 30%, #fff3b0, #ffe14d 60%, #d4a017); box-shadow: 0 0 16px rgba(255,225,77,.7); }
  @media (max-width: 560px) {
    .c4-board { grid-template-columns: repeat(7, 40px); grid-template-rows: repeat(6, 40px); gap: 6px; padding: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="back-link" href="../index.html">← Arcade</a>
    <div class="logo">🕹️ NEON ARCADE</div>
  </header>

  <h1 class="game-title">🔴 Connect 4</h1>
  <div id="difficulty-bar"></div>

  <div class="game-layout">
    <div class="panel">
      <div class="c4-board" id="board"></div>
    </div>
    <div class="panel" style="min-width:260px; flex:1;">
      <div class="status" id="status"></div>
      <div class="btn-row">
        <button class="btn" id="new-game" type="button">New game</button>
      </div>
      <p style="color:var(--muted); font-size:13px; line-height:1.6;">
        You are <b style="color:var(--red)">red</b> and move first; the computer is
        <b style="color:var(--yellow)">yellow</b>. First to connect four discs —
        horizontally, vertically, or diagonally — wins.<br><br>
        Win to climb a difficulty level; lose twice in a row and it eases off.
      </p>
    </div>
  </div>
</div>
<script src="../js/difficulty.js"></script>
<script src="connect4-logic.js"></script>
<script src="connect4-ui.js"></script>
</body>
</html>
